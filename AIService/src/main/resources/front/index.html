<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>千言·AI智能助手</title>
    <style>
        :root{
            --bg:#f4f7f9;
            --panel:#ffffff;
            --sidebar-bg:#eef3f6;
            --border:#e2e9ee;
            --text:#1e2a32;
            --text-muted:#6b7d89;
            --accent:#2f7796;
            --accent-hover:#27657f;
            --accent-soft:#e3eef4;
            --user-bubble:#2f7796;
            --user-text:#ffffff;
            --ai-bubble:#ffffff;
            --input-bg:#ffffff;
            --hover:rgba(47,119,150,.08);
            --danger:#c4554d;
            --shadow:0 1px 2px rgba(20,40,55,.05), 0 6px 20px rgba(20,40,55,.05);
        }
        [data-theme="dark"]{
            --bg:#0f1519;
            --panel:#161d22;
            --sidebar-bg:#131a1f;
            --border:#243039;
            --text:#dfe7ec;
            --text-muted:#8ea1ad;
            --accent:#57a2c2;
            --accent-hover:#6fb6d4;
            --accent-soft:#1b2b35;
            --user-bubble:#2b6b88;
            --user-text:#f2f8fb;
            --ai-bubble:#1a2229;
            --input-bg:#1a2229;
            --hover:rgba(87,162,194,.12);
            --danger:#e0796f;
            --shadow:0 1px 2px rgba(0,0,0,.35);
        }

        *{box-sizing:border-box;}
        html,body{height:100%;margin:0;}
        body{
            font-family:"PingFang SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
            font-size:15px;
            background:var(--bg);
            color:var(--text);
            -webkit-font-smoothing:antialiased;
            transition:background-color .25s ease,color .25s ease;
        }
        button{font-family:inherit;}
        ::-webkit-scrollbar{width:8px;height:8px;}
        ::-webkit-scrollbar-track{background:transparent;}
        ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
        ::-webkit-scrollbar-thumb:hover{background:var(--text-muted);}

        .app{display:flex;height:100vh;overflow:hidden;}

        /* ---------------- 侧边栏 ---------------- */
        .sidebar{
            width:272px;flex:0 0 272px;
            background:var(--sidebar-bg);
            border-right:1px solid var(--border);
            display:flex;flex-direction:column;
            transition:width .25s ease,background-color .25s ease,border-color .25s ease;
            overflow:hidden;
        }
        .sidebar.collapsed{
            width:0;flex:0 0 0;
            border-right:none;
        }
        .brand{display:flex;align-items:center;gap:10px;padding:20px 18px 16px;}
        .brand-mark{
            width:34px;height:34px;flex:0 0 34px;border-radius:10px;
            background:var(--accent);color:#fff;
            display:flex;align-items:center;justify-content:center;
            font-size:16px;font-weight:600;
        }
        .brand-text{font-size:15px;font-weight:600;letter-spacing:.2px;white-space:nowrap;}
        .sidebar-actions{padding:0 14px 12px;}
        .new-chat{
            width:100%;display:flex;align-items:center;justify-content:center;gap:6px;
            padding:10px 12px;border:1px solid transparent;border-radius:10px;
            background:var(--accent);color:#fff;font-size:14px;font-weight:500;
            cursor:pointer;transition:background-color .18s ease,transform .12s ease;
        }
        .new-chat:hover{background:var(--accent-hover);}
        .new-chat:active{transform:scale(.99);}
        .new-chat svg{width:15px;height:15px;}

        .session-list{
            flex:1;overflow-y:auto;padding:2px 10px 12px;
            display:flex;flex-direction:column;gap:2px;
        }
        .session-item{
            display:flex;align-items:center;gap:8px;
            padding:9px 10px;border-radius:9px;border:1px solid transparent;
            cursor:pointer;font-size:14px;color:var(--text-muted);
            transition:background-color .15s ease,color .15s ease;
        }
        .session-item:hover{background:var(--hover);color:var(--text);}
        .session-item.active{background:var(--accent-soft);color:var(--accent);font-weight:500;}
        .session-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
        .session-del{
            width:20px;height:20px;flex:0 0 20px;
            display:grid;place-items:center;
            border:none;background:transparent;color:inherit;
            border-radius:6px;cursor:pointer;font-size:15px;line-height:1;
            opacity:0;transition:opacity .15s ease,background-color .15s ease,color .15s ease;
        }
        .session-item:hover .session-del,
        .session-item.active .session-del{opacity:.55;}
        .session-del:hover{opacity:1 !important;background:var(--hover);color:var(--danger);}

        .sidebar-footer{
            padding:10px 18px 14px;border-top:1px solid var(--border);
            font-size:12px;color:var(--text-muted);
        }

        /* ---------------- 主区域 ---------------- */
        .main{
            flex:1;min-width:0;display:flex;flex-direction:column;
            background:var(--panel);
            transition:background-color .25s ease;
        }
        .topbar{
            flex:0 0 62px;height:62px;
            display:flex;align-items:center;justify-content:space-between;
            padding:0 22px;border-bottom:1px solid var(--border);
        }
        .topbar-left{display:flex;align-items:center;gap:10px;}
        .sidebar-toggle{
            width:36px;height:36px;display:grid;place-items:center;
            border:1px solid var(--border);border-radius:10px;
            background:transparent;color:var(--text-muted);cursor:pointer;
            transition:color .18s ease,background-color .18s ease,border-color .18s ease;
        }
        .sidebar-toggle:hover{color:var(--accent);background:var(--hover);border-color:transparent;}
        .sidebar-toggle svg{width:18px;height:18px;}
        .topbar-title{font-size:15px;font-weight:600;}

        .topbar-collapsed-actions{
            display:none;align-items:center;gap:8px;
        }
        .app:has(.sidebar.collapsed) .topbar-collapsed-actions{display:flex;}
        .app:has(.sidebar.collapsed) .topbar-title{display:none;}

        .collapsed-icon-btn{
            width:36px;height:36px;display:grid;place-items:center;
            border:1px solid var(--border);border-radius:10px;
            background:transparent;color:var(--text-muted);cursor:pointer;
            transition:color .18s ease,background-color .18s ease,border-color .18s ease;
        }
        .collapsed-icon-btn:hover{color:var(--accent);background:var(--hover);border-color:transparent;}
        .collapsed-icon-btn svg{width:18px;height:18px;}

        .messages-wrap{flex:1;overflow-y:auto;padding:26px 22px 8px;}
        .messages{
            max-width:860px;margin:0 auto;
            display:flex;flex-direction:column;
        }

        .msg{display:flex;margin-bottom:20px;align-items:flex-start;}
        .msg.user{justify-content:flex-end;}
        .msg.ai{justify-content:flex-start;}
        .bubble{
            max-width:min(76%,640px);
            padding:11px 15px;border-radius:12px;
            line-height:1.7;font-size:15px;
            white-space:pre-wrap;word-break:break-word;
        }
        .msg.ai .bubble{
            background:var(--ai-bubble);
            border:1px solid var(--border);
            border-top-left-radius:4px;
        }
        .msg.user .bubble{
            background:var(--user-bubble);
            color:var(--user-text);
            border-top-right-radius:4px;
        }
        .bubble.placeholder{color:var(--text-muted);}
        .bubble.error{color:var(--danger);}
        .bubble.streaming::after{
            content:"";display:inline-block;
            width:7px;height:15px;margin-left:3px;vertical-align:-2px;
            background:currentColor;opacity:.5;
            animation:blink 1s steps(2,start) infinite;
        }
        @keyframes blink{0%,50%{opacity:.5;}50.01%,100%{opacity:0;}}

        /* 无消息时：居中布局 */
        .main.no-messages .messages-wrap{
            flex:1;display:flex;flex-direction:column;
            align-items:center;justify-content:flex-start;
            overflow:visible;padding:0 22px;
        }
        .main.no-messages .messages{
            width:60%;flex:none;padding-top:22vh;
        }
        .main.no-messages .empty-composer{
            display:block;
        }
        .main.no-messages .composer{
            display:none;
        }

        /* 有消息时：底部输入区 */
        .main:not(.no-messages) .messages-wrap{
            flex:1;display:block;
            overflow-y:auto;padding:26px 22px 8px;
        }
        .main:not(.no-messages) .empty-composer{
            display:none;
        }
        .main:not(.no-messages) .composer{
            display:block;
        }

        .empty-state{text-align:center;color:var(--text-muted);}
        .empty-state h2{
            margin:0 0 28px;font-size:24px;font-weight:700;color:var(--text);
        }

        /* ---------------- 空状态居中输入区 ---------------- */
        .empty-composer{
            display:none;
            flex-direction:column;align-items:center;
            width:60%;padding:0 0 20px;
        }
        .empty-composer-inner{
            width:100%;max-width:100%;
            display:flex;align-items:flex-end;gap:14px;
            padding:18px 20px 18px 22px;
            background:var(--input-bg);
            border:1px solid var(--border);border-radius:16px;
            box-shadow:var(--shadow);
            transition:border-color .18s ease,background-color .25s ease;
        }
        .empty-composer-inner:focus-within{border-color:var(--accent);}
        #emptyInput{
            flex:1;border:none;outline:none;background:transparent;color:var(--text);
            font-family:inherit;font-size:17px;line-height:1.7;
            resize:none;overflow-y:auto;min-height:72px;max-height:240px;
            padding:8px 0;
        }
        #emptyInput::placeholder{color:var(--text-muted);opacity:.85;}
        .empty-send-btn{
            flex:0 0 auto;padding:12px 28px;
            border:none;border-radius:12px;
            background:var(--accent);color:#fff;
            font-size:16px;font-weight:500;cursor:pointer;
            transition:background-color .18s ease,opacity .18s ease;
        }
        .empty-send-btn:hover{background:var(--accent-hover);}
        .empty-composer-hint{
            margin-top:10px;font-size:12px;color:var(--text-muted);text-align:center;
        }

        /* ---------------- 输入区 ---------------- */
        .composer{padding:12px 22px 18px;}
        .composer-inner{
            max-width:860px;margin:0 auto;
            display:flex;align-items:flex-end;gap:10px;
            padding:8px 8px 8px 14px;
            background:var(--input-bg);
            border:1px solid var(--border);border-radius:12px;
            transition:border-color .18s ease,background-color .25s ease;
        }
        .composer-inner:focus-within{border-color:var(--accent);}
        #input{
            flex:1;border:none;outline:none;background:transparent;color:var(--text);
            font-family:inherit;font-size:15px;line-height:1.6;
            resize:none;overflow-y:auto;min-height:24px;max-height:168px;
            padding:6px 0;
        }
        #input::placeholder{color:var(--text-muted);opacity:.85;}
        .send-btn{
            flex:0 0 auto;padding:9px 18px;
            border:none;border-radius:9px;
            background:var(--accent);color:#fff;
            font-size:14px;font-weight:500;cursor:pointer;
            transition:background-color .18s ease,opacity .18s ease;
        }
        .send-btn:hover{background:var(--accent-hover);}
        .send-btn.stop{background:var(--danger);}
        .composer-hint{
            max-width:860px;margin:8px auto 0;
            font-size:12px;color:var(--text-muted);text-align:center;
        }

        /* ============ 移动端适配 ============ */
        @media (max-width:820px){
            .sidebar{width:260px;flex:0 0 260px;}
            .sidebar.collapsed{width:0;flex:0 0 0;}
            .topbar{padding:0 14px;flex:0 0 54px;height:54px;}
            .messages-wrap{padding:16px 14px 8px;}
            .main:not(.no-messages) .messages-wrap{padding:16px 14px 8px;}
            .bubble{max-width:84%;font-size:14px;padding:10px 13px;}
            .composer{padding:10px 14px 14px;}
            .composer-inner{padding:10px 10px 10px 14px;border-radius:12px;gap:10px;}
            #input{min-height:44px;font-size:15px;padding:10px 0;}
            .send-btn{padding:10px 18px;font-size:14px;}
            .composer-hint{display:none;}
            .main.no-messages .messages-wrap{
                flex:1;display:flex;flex-direction:column;
                align-items:center;justify-content:center;
                padding:0 14px;
            }
            .main.no-messages .messages{width:100%;padding-top:0;}
            .main.no-messages .empty-composer{display:none;}
            .main.no-messages .composer{display:block;}
            .empty-state h2,.empty-state h1{font-size:24px;margin-bottom:0;}
        }

        @media (max-width:600px){
            .sidebar{width:260px;flex:0 0 260px;}
            .sidebar.collapsed{width:0;flex:0 0 0;}
            .brand-text{font-size:14px;display:inline;}
            .topbar{padding:0 10px;flex:0 0 50px;height:50px;}
            .topbar-left{gap:6px;}
            .sidebar-toggle,.collapsed-icon-btn,.icon-btn{width:32px;height:32px;border-radius:8px;}
            .sidebar-toggle svg,.collapsed-icon-btn svg,.icon-btn svg{width:16px;height:16px;}
            .messages-wrap{padding:12px 10px 6px;}
            .main:not(.no-messages) .messages-wrap{padding:12px 10px 6px;}
            .msg{margin-bottom:14px;}
            .bubble{max-width:90%;font-size:14px;padding:9px 12px;line-height:1.6;}
            .composer{padding:8px 10px 12px;}
            .composer-inner{padding:8px 8px 8px 12px;border-radius:12px;gap:8px;}
            #input{min-height:42px;font-size:15px;padding:10px 0;}
            .send-btn{padding:10px 16px;font-size:14px;}
            .main.no-messages .messages-wrap{padding:0 10px;}
            .main.no-messages .messages{width:100%;padding-top:0;}
            .empty-state h2,.empty-state h1{font-size:22px;}
        }

        .icon-btn{width:36px;height:36px;display:grid;place-items:center;}
        .icon-btn svg{width:18px;height:18px;}
        .icon-moon{display:none;}
        [data-theme="dark"] .icon-sun{display:none;}
        [data-theme="dark"] .icon-moon{display:block;}

        .icon-sidebar-close{display:none;}
        .app:has(.sidebar.collapsed) .icon-sidebar-open{display:none;}
        .app:has(.sidebar.collapsed) .icon-sidebar-close{display:block;}

    </style>
</head>
<body>
<div class="app">
    <!-- 侧边栏 -->
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-mark">千</div>
            <div class="brand-text">千言·AI智能助手</div>
        </div>
        <div class="sidebar-actions">
            <button class="new-chat" id="newChatBtn" type="button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 5v14M5 12h14"/>
                </svg>
                新建聊天
            </button>
        </div>
        <div class="session-list" id="sessionList"></div>
        <div class="sidebar-footer">用户 ID：<span id="uidLabel">-</span></div>
    </aside>

    <!-- 主聊天区 -->
    <main class="main">
        <header class="topbar">
            <div class="topbar-left">
                <button class="sidebar-toggle" id="sidebarToggleBtn" type="button" title="收起侧边栏" aria-label="收起侧边栏">
                    <svg class="icon-sidebar-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                         stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2"/>
                        <line x1="9" y1="3" x2="9" y2="21"/>
                    </svg>
                    <svg class="icon-sidebar-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                         stroke-linecap="round" stroke-linejoin="round">
                        <line x1="3" y1="6" x2="21" y2="6"/>
                        <line x1="3" y1="12" x2="21" y2="12"/>
                        <line x1="3" y1="18" x2="21" y2="18"/>
                    </svg>
                </button>
                <div class="topbar-collapsed-actions">
                    <button class="collapsed-icon-btn" id="newChatCollapsedBtn" type="button" title="新建聊天" aria-label="新建聊天">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 5v14M5 12h14"/>
                        </svg>
                    </button>
                </div>
                <div class="topbar-title" id="chatTitle">会话 #------</div>
            </div>
            <button class="icon-btn" id="themeBtn" type="button" title="切换主题" aria-label="切换主题">
                <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.8" stroke-linecap="round">
                    <circle cx="12" cy="12" r="4"/>
                    <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/>
                </svg>
                <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
                </svg>
            </button>
        </header>

        <div class="messages-wrap" id="messagesWrap">
            <div class="messages" id="messages"></div>
            <div class="empty-composer">
                <div class="empty-composer-inner">
                    <textarea id="emptyInput" rows="2"
                              placeholder="输入你的问题，开始一段新的对话吧…"></textarea>
                    <button class="empty-send-btn" id="emptySendBtn" type="button">发送</button>
                </div>
                <div class="empty-composer-hint">AI 回复由模型生成，请注意甄别。</div>
            </div>
        </div>

        <div class="composer">
            <div class="composer-inner">
        <textarea id="input" rows="1"
                  placeholder="输入消息，Enter 发送，Shift + Enter 换行"></textarea>
                <button class="send-btn" id="sendBtn" type="button">发送</button>
            </div>
            <div class="composer-hint">AI 回复由模型生成，请注意甄别。</div>
        </div>
    </main>
</div>

<script>
    (function () {
        'use strict';

        /* =========================================================
         * 配置
         * =======================================================*/
        var API_URL      = 'http://47.114.52.145:10010/api/streamChat';
        var KEY_UID      = 'qianyan.userId';
        var KEY_THEME    = 'qianyan.theme';
        var KEY_SESSIONS = 'qianyan.sessions';
        var KEY_ACTIVE   = 'qianyan.activeSession';
        var KEY_SIDEBAR  = 'qianyan.sidebarCollapsed';

        /* =========================================================
         * DOM
         * =======================================================*/
        var els = {
            sessionList          : document.getElementById('sessionList'),
            messages             : document.getElementById('messages'),
            messagesWrap         : document.getElementById('messagesWrap'),
            input                : document.getElementById('input'),
            sendBtn              : document.getElementById('sendBtn'),
            themeBtn             : document.getElementById('themeBtn'),
            newChatBtn           : document.getElementById('newChatBtn'),
            newChatCollapsedBtn  : document.getElementById('newChatCollapsedBtn'),
            chatTitle            : document.getElementById('chatTitle'),
            uidLabel             : document.getElementById('uidLabel'),
            sidebarToggleBtn     : document.getElementById('sidebarToggleBtn')
        };

        /* =========================================================
         * 状态
         * =======================================================*/
        var state = {
            sessions: [],
            activeId: null,
            userId: 0,
            theme: 'light',
            sidebarCollapsed: false
        };

        /* =========================================================
         * 工具
         * =======================================================*/
        function randSix() {
            return Math.floor(100000 + Math.random() * 900000);
        }

        function activeSession() {
            for (var i = 0; i < state.sessions.length; i++) {
                if (state.sessions[i].id === state.activeId) return state.sessions[i];
            }
            return null;
        }

        function newSessionId() {
            var used = {};
            state.sessions.forEach(function (s) { used[s.id] = true; });
            var id;
            do { id = randSix(); } while (used[id]);
            return id;
        }

        /* =========================================================
         * 用户 ID（初始化一次，持久化）
         * =======================================================*/
        function initUserId() {
            var v = localStorage.getItem(KEY_UID);
            if (!/^\d{6}$/.test(v || '')) {
                v = String(randSix());
                localStorage.setItem(KEY_UID, v);
            }
            state.userId = parseInt(v, 10);
            els.uidLabel.textContent = v;
        }

        /* =========================================================
         * 主题
         * =======================================================*/
        function applyTheme() {
            document.documentElement.setAttribute('data-theme', state.theme);
            els.themeBtn.title = state.theme === 'dark' ? '切换到白天主题' : '切换到黑夜主题';
        }

        function initTheme() {
            state.theme = localStorage.getItem(KEY_THEME) === 'dark' ? 'dark' : 'light';
            applyTheme();
        }

        function toggleTheme() {
            state.theme = state.theme === 'dark' ? 'light' : 'dark';
            localStorage.setItem(KEY_THEME, state.theme);
            applyTheme();
        }

        /* =========================================================
         * 侧边栏收起/展开
         * =======================================================*/
        function applySidebar() {
            var sidebar = document.querySelector('.sidebar');
            if (state.sidebarCollapsed) {
                sidebar.classList.add('collapsed');
                els.sidebarToggleBtn.title = '展开侧边栏';
                els.sidebarToggleBtn.setAttribute('aria-label', '展开侧边栏');
            } else {
                sidebar.classList.remove('collapsed');
                els.sidebarToggleBtn.title = '收起侧边栏';
                els.sidebarToggleBtn.setAttribute('aria-label', '收起侧边栏');
            }
        }

        function initSidebar() {
            var saved = localStorage.getItem(KEY_SIDEBAR);
            state.sidebarCollapsed = saved !== null ? saved === 'true' : true;
            applySidebar();
        }

        function toggleSidebar() {
            state.sidebarCollapsed = !state.sidebarCollapsed;
            localStorage.setItem(KEY_SIDEBAR, String(state.sidebarCollapsed));
            applySidebar();
        }

        /* =========================================================
         * 持久化
         * =======================================================*/
        function persist() {
            try {
                var data = state.sessions.map(function (s) {
                    return {
                        id: s.id,
                        messages: s.messages.map(function (m) {
                            return { role: m.role, content: m.content };
                        })
                    };
                });
                localStorage.setItem(KEY_SESSIONS, JSON.stringify(data));
                if (state.activeId != null) {
                    localStorage.setItem(KEY_ACTIVE, String(state.activeId));
                }
            } catch (e) { /* 忽略存储异常 */ }
        }

        function loadSessions() {
            var list = [];
            try {
                var raw = localStorage.getItem(KEY_SESSIONS);
                if (raw) {
                    var parsed = JSON.parse(raw);
                    if (Array.isArray(parsed)) {
                        list = parsed.filter(function (s) {
                            return s && Number.isInteger(s.id) && s.id >= 100000 && s.id <= 999999;
                        }).map(function (s) {
                            return {
                                id: s.id,
                                messages: Array.isArray(s.messages)
                                    ? s.messages.filter(function (m) {
                                        return m && (m.role === 'user' || m.role === 'ai');
                                    }).map(function (m) {
                                        return { role: m.role, content: String(m.content == null ? '' : m.content) };
                                    })
                                    : [],
                                controller: null
                            };
                        });
                    }
                }
            } catch (e) { list = []; }

            state.sessions = list;

            var savedActive = parseInt(localStorage.getItem(KEY_ACTIVE) || '', 10);
            var found = state.sessions.some(function (s) { return s.id === savedActive; });

            if (found) {
                state.activeId = savedActive;
            } else if (state.sessions.length) {
                state.activeId = state.sessions[0].id;
            } else {
                var s = { id: randSix(), messages: [], controller: null };
                state.sessions = [s];
                state.activeId = s.id;
            }
        }

        /* =========================================================
         * 渲染
         * =======================================================*/
        function renderAll() {
            renderSessions();
            renderMessages();
            renderTitle();
            updateSendButton();
        }

        function renderTitle() {
            var s = activeSession();
            els.chatTitle.textContent = s ? '会话 #' + s.id : '未选择会话';
        }

        function renderSessions() {
            els.sessionList.innerHTML = '';
            state.sessions.forEach(function (s) {
                var item = document.createElement('div');
                item.className = 'session-item' + (s.id === state.activeId ? ' active' : '');
                item.setAttribute('role', 'button');
                item.setAttribute('tabindex', '0');

                var title = document.createElement('span');
                title.className = 'session-title';
                title.textContent = '会话 #' + s.id;

                var del = document.createElement('button');
                del.className = 'session-del';
                del.type = 'button';
                del.title = '删除会话';
                del.setAttribute('aria-label', '删除会话 #' + s.id);
                del.textContent = '×';
                del.addEventListener('click', function (e) {
                    e.stopPropagation();
                    deleteSession(s.id);
                });

                item.appendChild(title);
                item.appendChild(del);
                item.addEventListener('click', function () { switchSession(s.id); });
                item.addEventListener('keydown', function (e) {
                    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); switchSession(s.id); }
                });

                els.sessionList.appendChild(item);
            });
        }

        function renderMessages() {
            els.messages.innerHTML = '';
            var s = activeSession();
            if (!s) return;

            if (!s.messages.length) {
                var empty = document.createElement('div');
                empty.className = 'empty-state';
                empty.innerHTML = '<h1>你好，让我们开始聊天吧</h1>';
                els.messages.appendChild(empty);
                document.querySelector('.main').classList.add('no-messages');
            } else {
                document.querySelector('.main').classList.remove('no-messages');
                s.messages.forEach(function (m) { createMessageEl(m); });
                scrollToBottom();
            }
            syncActiveInput();
        }

        function createMessageEl(msg) {
            var row = document.createElement('div');
            row.className = 'msg ' + (msg.role === 'user' ? 'user' : 'ai');

            var bubble = document.createElement('div');
            bubble.className = 'bubble';

            if (msg.streaming) {
                bubble.classList.add('streaming');
                if (msg.content) {
                    bubble.textContent = msg.content;
                } else {
                    bubble.classList.add('placeholder');
                    bubble.textContent = '思考中…';
                }
            } else {
                bubble.textContent = msg.content;
            }

            row.appendChild(bubble);
            els.messages.appendChild(row);
            return bubble;
        }

        var scrollPending = false;
        function scrollToBottom() {
            els.messagesWrap.scrollTop = els.messagesWrap.scrollHeight;
        }
        function scheduleScroll() {
            if (scrollPending) return;
            scrollPending = true;
            requestAnimationFrame(function () {
                scrollPending = false;
                scrollToBottom();
            });
        }

        function updateSendButton() {
            var s = activeSession();
            var streaming = !!(s && s.controller);
            els.sendBtn.textContent = streaming ? '停止' : '发送';
            els.sendBtn.classList.toggle('stop', streaming);
        }

        /* =========================================================
         * 会话管理
         * =======================================================*/
        function abortStream(session) {
            if (!session || !session.controller) return;
            try { session.controller.abort(); } catch (e) { /* ignore */ }
            session.controller = null;
        }

        function createSession() {
            abortStream(activeSession());          // 新建会话时中断当前流
            var session = { id: newSessionId(), messages: [], controller: null };
            state.sessions.unshift(session);
            state.activeId = session.id;
            renderAll();
            persist();
            els.input.focus();
            return session;
        }

        function switchSession(id) {
            if (id === state.activeId) return;
            abortStream(activeSession());          // 切换会话时中断当前流
            state.activeId = id;
            renderAll();
            persist();
            els.input.focus();
        }

        function deleteSession(id) {
            var idx = -1;
            for (var i = 0; i < state.sessions.length; i++) {
                if (state.sessions[i].id === id) { idx = i; break; }
            }
            if (idx === -1) return;

            var target = state.sessions[idx];
            abortStream(target);                   // 删除时中断该会话的流
            state.sessions.splice(idx, 1);

            if (state.activeId === id) {
                if (state.sessions.length) {
                    var next = state.sessions[Math.min(idx, state.sessions.length - 1)];
                    state.activeId = next.id;
                    renderAll();
                    persist();
                } else {
                    state.activeId = null;
                    createSession();                   // 无其他会话 -> 自动新建
                }
            } else {
                renderAll();
                persist();
            }
        }

        /* =========================================================
         * 流式解析器：兼容纯文本 chunked 与 SSE(data: xxx)
         * =======================================================*/
        function createStreamParser(onText) {
            var buf = '';
            var mode = null; // null | 'sse' | 'text'

            function handleLine(line) {
                if (!line) return;
                if (line.indexOf('data:') === 0) {
                    var content = line.slice(5);
                    if (content.charAt(0) === ' ') content = content.slice(1);
                    if (content.trim() === '[DONE]') return;
                    if (content !== '') onText(content);
                }
                // event: / id: / retry: / :注释 一律忽略
            }

            function flushLines() {
                var idx;
                while ((idx = buf.indexOf('\n')) !== -1) {
                    var line = buf.slice(0, idx).replace(/\r$/, '');
                    buf = buf.slice(idx + 1);
                    handleLine(line);
                }
            }

            function detect() {
                var head = buf.replace(/^[\s\uFEFF]+/, '');
                if (head.length < 5 && buf.indexOf('\n') === -1) return false;
                mode = (head.indexOf('data:') === 0 || head.indexOf(':') === 0) ? 'sse' : 'text';
                return true;
            }

            return {
                push: function (chunk) {
                    if (!chunk) return;
                    buf += chunk;
                    if (mode === null && !detect()) return;
                    if (mode === 'sse') {
                        flushLines();
                    } else {
                        onText(buf);
                        buf = '';
                    }
                },
                end: function () {
                    if (!buf) return;
                    if (mode === 'sse' || (mode === null && /^\s*data:/.test(buf))) {
                        flushLines();
                        if (buf) { handleLine(buf.replace(/\r$/, '')); buf = ''; }
                    } else {
                        onText(buf);
                        buf = '';
                    }
                }
            };
        }

        /* =========================================================
         * 发送消息 + 流式接收
         * =======================================================*/
        function sendMessage() {
            var s = activeSession();
            if (!s) return;

            var text = els.input.value.trim();
            if (!text) return;

            // 1. 用户消息
            var userMsg = { role: 'user', content: text };
            s.messages.push(userMsg);
            if (els.messages.querySelector('.empty-state')) els.messages.innerHTML = '';

            var main = document.querySelector('.main');
            if (main.classList.contains('no-messages')) {
                main.classList.remove('no-messages');
                syncActiveInput();
            }

            createMessageEl(userMsg);

            // 2. AI 占位消息
            var aiMsg = { role: 'ai', content: '', streaming: true };
            s.messages.push(aiMsg);
            var bubble = createMessageEl(aiMsg);
            scheduleScroll();

            els.input.value = '';
            autoResize();
            persist();

            // 3. 发起请求
            var controller = new AbortController();
            s.controller = controller;
            updateSendButton();

            var acc = '';
            var gotFirst = false;

            function onText(t) {
                if (!t) return;
                if (!gotFirst) {
                    gotFirst = true;
                    bubble.classList.remove('placeholder');
                    bubble.textContent = '';
                }
                acc += t;
                aiMsg.content = acc;
                bubble.textContent = acc;
                scheduleScroll();
            }

            var parser = createStreamParser(onText);

            fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    sessionId: s.id,
                    userId: state.userId,
                    prompt: text
                }),
                signal: controller.signal
            }).then(function (res) {
                if (!res.ok) throw new Error('HTTP ' + res.status);
                if (!res.body || !res.body.getReader) throw new Error('当前浏览器不支持流式响应');

                var reader = res.body.getReader();
                var decoder = new TextDecoder('utf-8');

                function pump() {
                    return reader.read().then(function (result) {
                        if (result.done) {
                            parser.push(decoder.decode());
                            parser.end();
                            if (!acc) onText('（未收到内容）');
                            return;
                        }
                        parser.push(decoder.decode(result.value, { stream: true }));
                        return pump();
                    });
                }
                return pump();
            }).catch(function (err) {
                if (err && err.name === 'AbortError') {
                    if (!acc) {
                        bubble.classList.remove('placeholder');
                        bubble.textContent = '（已中断）';
                    }
                } else {
                    var errText = '⚠ 请求失败：' + ((err && err.message) || err);
                    acc = acc ? acc + '\n\n' + errText : errText;
                    bubble.classList.remove('placeholder');
                    bubble.classList.add('error');
                    bubble.textContent = acc;
                    aiMsg.content = acc;
                }
            }).then(function () {
                // 收尾
                if (s.controller === controller) s.controller = null;
                aiMsg.streaming = false;
                bubble.classList.remove('streaming', 'placeholder');
                updateSendButton();
                persist();
                scheduleScroll();
            });
        }

        /* =========================================================
         * 输入框
         * =======================================================*/
        function autoResize() {
            var el = els.input;
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 168) + 'px';
        }

        var emptyInputEl = document.getElementById('emptyInput');
        var emptyComposerEl = document.querySelector('.empty-composer');
        var activeInputId = 'input';

        function syncActiveInput() {
            var main = document.querySelector('.main');
            var isMobile = window.matchMedia('(max-width: 820px)').matches;
            if (main.classList.contains('no-messages') && !isMobile) {
                activeInputId = 'emptyInput';
                els.input = emptyInputEl;
                els.sendBtn = document.getElementById('emptySendBtn');
            } else {
                activeInputId = 'input';
                els.input = document.getElementById('input');
                els.sendBtn = document.getElementById('sendBtn');
            }
            updateSendButton();
        }

        function autoResizeEmpty() {
            var el = emptyInputEl;
            if (!el) return;
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 168) + 'px';
        }

        emptyInputEl.addEventListener('input', autoResizeEmpty);

        emptyInputEl.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
                e.preventDefault();
                sendMessage();
            }
        });

        document.getElementById('emptySendBtn').addEventListener('click', function () {
            var s = activeSession();
            if (s && s.controller) {
                abortStream(s);
                updateSendButton();
                return;
            }
            sendMessage();
        });

        els.input.addEventListener('input', autoResize);

        els.input.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
                e.preventDefault();
                sendMessage();
            }
        });

        els.sendBtn.addEventListener('click', function () {
            var s = activeSession();
            if (s && s.controller) {   // 流式中点击 = 停止
                abortStream(s);
                updateSendButton();
                return;
            }
            sendMessage();
        });

        els.newChatBtn.addEventListener('click', function () { createSession(); });
        els.newChatCollapsedBtn.addEventListener('click', function () { createSession(); });
        els.themeBtn.addEventListener('click', toggleTheme);
        els.sidebarToggleBtn.addEventListener('click', toggleSidebar);

        /* =========================================================
         * 启动
         * =======================================================*/
        function init() {
            initUserId();
            initTheme();
            initSidebar();
            loadSessions();
            renderAll();
            autoResize();
            els.input.focus();
        }

        init();
    })();
</script>
</body>
</html>
